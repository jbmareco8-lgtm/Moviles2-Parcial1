name: CI - Parcial 2

'on':
  push:
    branches: ['parcial2-integrador', 'feature/**', 'refactor/**']
  pull_request:
    branches: ['parcial2-integrador']

jobs:
  test:
    name: Tests - ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Seleccionar SDK de .NET 9
        run: dotnet new globaljson --sdk-version 9.0.100 --roll-forward latestFeature --force

      - name: Cache de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Restaurar dependencias
        run: dotnet restore Parcial1.Tests/Parcial1.Tests.csproj

      - name: Compilar proyecto de pruebas
        run: dotnet build Parcial1.Tests/Parcial1.Tests.csproj -c Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test Parcial1.Tests/Parcial1.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.os }}
          path: TestResults/

  build-android:
    name: Compilar Android
    needs: test
    runs-on: windows-2022

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Seleccionar SDK de .NET 9
        run: dotnet new globaljson --sdk-version 9.0.100 --roll-forward latestFeature --force

      - name: Instalar workload de MAUI Android
        run: dotnet workload install maui-android

      - name: Cache de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Restaurar dependencias
        run: dotnet restore Parcial1/Parcial1.csproj -p:CiAndroidOnly=true

      - name: Compilar aplicacion Android
        run: dotnet build Parcial1/Parcial1.csproj -f net9.0-android -c Debug --no-restore -p:CiAndroidOnly=true -p:AndroidBuildApplicationPackage=true -p:AndroidPackageFormats=apk -p:EmbedAssembliesIntoApk=true

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: parcial2-android
          path: Parcial1/bin/Debug/net9.0-android/**/*-Signed.apk
          if-no-files-found: error